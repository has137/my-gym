# My gym: publishes this fork's app to GitHub Pages: https://has137.github.io/my-gym/
#
# (Upstream openGym uses this workflow for its browser-only demo, VITE_DEMO=1.)
#
# Pages serves static files only, so this build has no backend: VITE_STANDALONE=1 makes the app
# boot straight into guest mode with an empty profile, and everything stays on the phone
# (localStorage); the app reminds you weekly to export a backup (src/mygym, Settings → Data).
# The exercise stills and animations (180 px, Gym visual, see NOTICE.md) come from catalogue/media
# unmodified and are staged next to the build by scripts/catalogue/stage-media.mjs, so the app
# serves them from its own origin, as openGym's demo does.
name: Deploy My gym to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_STANDALONE: '1'
      # The 180 px stills and animations from catalogue/media, served next to the app
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
